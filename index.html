<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./birthday-surprise/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Surprise</title>
    <style>
      :root {
        --bg: #140d25;
        --card: rgba(255,255,255,0.08);
        --text: #f9ebff;
        --gold: #f7d28a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top, #3b2b61 0%, #1a132f 35%, #0e0a18 100%);
      }
      .card {
        width: min(540px, 86vw);
        padding: 32px 28px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 24px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.28);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
        color: var(--gold);
      }
      p {
        margin: 0 0 18px;
        opacity: 0.85;
      }
      a {
        color: #fff;
        text-decoration: none;
        background: linear-gradient(135deg, #f9afdb, #d9adff, #ffd885);
        color: #261337;
        font-weight: 700;
        padding: 12px 22px;
        border-radius: 999px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Birthday Surprise</h1>
      <p>Redirecting to the birthday website...</p>
      <a href="./birthday-surprise/">Open the surprise</a>
    </div>
  </body>
</html>
